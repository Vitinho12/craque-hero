<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1e824c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <title>Craque Hero - Drible de Futebol & Pênalti</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Canvas de Renderização do Campo e Jogadores -->
        <canvas id="gameCanvas"></canvas>

        <!-- Efeito de Estádio (Iluminação Suave) -->
        <div id="stadium-overlay"></div>

        <!-- HUD Superior da Partida -->
        <div id="arcade-hud">
            <!-- Barra de Câmera Lenta (Slow-Mo) -->
            <div id="stamina-container" title="Barra de Câmera Lenta (Slow-Mo)">
                <div class="stamina-label">SLOW-MO</div>
                <div class="stamina-frame">
                    <div id="stamina-bar"></div>
                </div>
            </div>

            <!-- Placar de Futebol: Metros até a Área, Pontos e Gols -->
            <div id="top-stats-row">
                <div class="arcade-card meters-card">
                    <span class="card-tag">AVANÇO</span>
                    <span id="meters-txt">0m <small>/ 1000m</small></span>
                </div>

                <div class="arcade-card score-card">
                    <span class="card-tag">PONTOS</span>
                    <span id="score-txt">0</span>
                </div>

                <div class="arcade-card goals-card">
                    <span class="card-tag">GOLS</span>
                    <span id="goals-txt">0</span>
                </div>

                <button id="sound-btn" class="arcade-btn-icon" title="Alternar Áudio">🔊</button>
            </div>
        </div>

        <!-- Notificação Flutuante de Drible (Ex: "DRIBLE DE CRAQUE! +150") -->
        <div id="combo-popup" class="hidden"></div>

        <!-- Controles de Ação na Corrida -->
        <div id="action-controls">
            <!-- Botão de Câmera Lenta -->
            <button id="slowmo-btn" class="arcade-action-btn btn-slowmo" title="Segure para Câmera Lenta">
                <span class="btn-icon">⏱️</span>
                <span class="btn-lbl">SLOW-MO</span>
            </button>

            <!-- Botão de Giro 360° -->
            <button id="spin-btn" class="arcade-action-btn btn-spin" title="Giro 360° com a Bola">
                <span class="btn-icon">🌪️</span>
                <span class="btn-lbl">GIRO</span>
                <div id="spin-cooldown-shade"></div>
            </button>
        </div>

        <!-- Interface do Pênalti (Compacta e SEM cobrir a trave e o goleiro!) -->
        <div id="penalty-ui" class="hidden">
            <!-- Header Compacto que fica no topo sem tampar a trave -->
            <div class="penalty-compact-header">
                <span class="penalty-badge">DISPUTA DE PÊNALTI</span>
                <span class="penalty-sub">Mire nos cantos da trave e estufe a rede!</span>
            </div>

            <!-- Botão de Chute no rodapé -->
            <div class="penalty-footer">
                <button id="penalty-kick-btn" class="btn-penalty-shoot">
                    <span>⚽ BATER O PÊNALTI!</span>
                </button>
            </div>
        </div>

        <!-- Dica de Início -->
        <div id="hint-bubble">
            Arraste livremente em 2D para driblar a zaga • Segure Slow-Mo para achar espaços
        </div>

        <!-- Tela de Fim de Jogo -->
        <div id="game-over-screen" class="hidden">
            <div class="arcade-modal">
                <div class="modal-badge" id="over-emoji">💥</div>
                <h1 class="modal-title">FIM DE JOGO</h1>
                <p id="over-desc" class="modal-subtitle">O zagueiro roubou a bola!</p>

                <div class="modal-stats-grid">
                    <div class="modal-stat">
                        <span class="m-label">DISTÂNCIA</span>
                        <span id="res-meters" class="m-val">0m</span>
                    </div>
                    <div class="modal-stat highlight">
                        <span class="m-label">PONTOS</span>
                        <span id="res-score" class="m-val">0</span>
                    </div>
                    <div class="modal-stat">
                        <span class="m-label">GOLS</span>
                        <span id="res-goals" class="m-val">0</span>
                    </div>
                    <div class="modal-stat">
                        <span class="m-label">DRIBLES</span>
                        <span id="res-dribbles" class="m-val">0</span>
                    </div>
                </div>

                <div class="best-score-tag">
                    🏆 RECORDE: <strong id="res-best">0 PTS</strong>
                </div>

                <button id="retry-btn" class="arcade-btn-primary">
                    <span>🔄 JOGAR NOVAMENTE</span>
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
